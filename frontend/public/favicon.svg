<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <radialGradient id="flame" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="55%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- handle -->
  <path d="M16 8 Q20 2 24 8" stroke="url(#g)" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- cap -->
  <path d="M16 8 H24 L31 12 H9 Z" fill="url(#g)" opacity="0.25" stroke="url(#g)" stroke-width="1.3" stroke-linejoin="round"/>

  <!-- body -->
  <rect x="9" y="12" width="22" height="17" rx="4" fill="url(#g)" opacity="0.15" stroke="url(#g)" stroke-width="1.8"/>

  <!-- base -->
  <path d="M9 29 H31 L33 34 H7 Z" fill="url(#g)" opacity="0.25" stroke="url(#g)" stroke-width="1.3" stroke-linejoin="round"/>

  <!-- glow + flame -->
  <circle cx="20" cy="20.5" r="6" fill="url(#flame)"/>
  <circle cx="20" cy="20.5" r="2.6" fill="#fbbf24"/>
</svg>
